name=K\u00e5lflymodell
description={{filename="/images/ef-20051121-130756.jpg" description="Foto: E. Fl\u00f8istad"}}\n<h1>Modellbeskrivelse</h1>\n<p>Varslingsmodellen for k&aring;lfly er en egenutviklet modell, utviklet av Dr. Nina Svae Johansen, som er basert p&aring; nedre temperaturgrense for utvikling og varmesumkrav for de ulike utviklingsstadiene hos k&aring;lfly (Johansen, 1996). Varmesummodellen regner ut prognoser for k&aring;lflyets utvikling gjennom sommeren, gir varsel om tidspunkt for n&aring;r egg og sm&aring; larver av k&aring;lfly kan registreres i &aring;keren og om riktig spr&oslash;ytetidspunkt (Johansen, 1997).</p>\n<p>Tabell 1: K&aring;lflyets utviklingsstadier, krav til basistemperatur og d&oslash;gngrader for utvikling</p>\n<table width="640" cellspacing="0" cellpadding="7">\n<tbody>\n<tr>\n<td width="162">\n<p><strong>Utviklingsperiode</strong></p>\n</td>\n<td width="99">\n<p><strong>Basistemperatur</strong></p>\n</td>\n<td width="71">\n<p><strong>Krav d&oslash;gngrader</strong></p>\n</td>\n<td width="128">\n<p><strong>Sum d&oslash;gngrader totalt <br />(med ulike basistemp.)</strong></p>\n</td>\n<td width="108">\n<p><strong>Varselstatus</strong></p>\n</td>\n</tr>\n<tr>\n<td width="162">\n<p>1. Utvikling av overvintrende pupper fram til sverming</p>\n</td>\n<td width="99">\n<p>Pupper: 7,5 &deg;C (TMJ10)</p>\n</td>\n<td width="71">\n<p>129</p>\n</td>\n<td width="128">\n<p>129</p>\n</td>\n<td bgcolor="#70ad47" width="108">\n<p>SUMDG &lt; 158</p>\n</td>\n</tr>\n<tr>\n<td width="162">\n<p>2. Begynnende sverming til begynnende egglegging </p>\n</td>\n<td width="99">\n<p>Egglegging: 5,0 &deg;C (TM)</p>\n</td>\n<td width="71">\n<p>56</p>\n</td>\n<td width="128">\n<p>129+56=158</p>\n</td>\n<td bgcolor="#ffc000" width="108">\n<p>SUMDG &ge;158&lt;326</p>\n</td>\n</tr>\n<tr>\n<td width="162">\n<p>3. Begynnende egglegging til f&oslash;rste larver i stadium 2</p>\n</td>\n<td width="99">\n<p>Egg: 8,6 &deg;C (TM)</p>\n<p>L1: 7,7 &deg;C (TM)</p>\n</td>\n<td width="71">\n<p>Egg: 75</p>\n<p>L1: 66</p>\n</td>\n<td width="128">\n<p>129+56+75+66=326</p>\n</td>\n<td bgcolor="#ff0000" width="108">\n<p>SUMDG &ge;326&lt;428</p>\n</td>\n</tr>\n<tr>\n<td width="162">\n<p>4. F&oslash;rste larver i stadium 2 til f&oslash;rste larver i stadium 4</p>\n</td>\n<td width="99">\n<p>L2: 6,9 &deg;C (TM)</p>\n<p>L3: 6,3 &deg;C (TM)</p>\n</td>\n<td width="71">\n<p>L2: 49</p>\n<p>L3: 53</p>\n</td>\n<td width="128">\n<p>129+56+75+66+49+53=428</p>\n</td>\n<td bgcolor="#ffc000" width="108">\n<p>SUMDG &ge;428&lt;557</p>\n</td>\n</tr>\n<tr>\n<td width="162">\n<p>5. F&oslash;rste larver i stadium 4 til f&oslash;rste larver i stadium 6</p>\n</td>\n<td width="99">\n<p>L4: 4,3 &deg;C (TM)</p>\n<p>L5: 6,0 &deg;C (TM)</p>\n</td>\n<td width="71">\n<p>L4: 67</p>\n<p>L5: 62</p>\n</td>\n<td width="128">\n<p>129+56+75+66+49+53+67+62=557</p>\n</td>\n<td bgcolor="#d0cece" width="108">\n<p>SUMDG &ge;557</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p><br />Det benyttes historiske v&aelig;rdata og v&aelig;rprognoser (2-d&oslash;gnsprognose, dvs. prognose for dagen i dag og en dag frem) i modellen.</p>\n<p>M&aring;lte parametere som inng&aring;r i modellen er standard lufttemperatur (TM) og jordtemperatur i 10 cm dybde (TMJ 10), timesverdier. Beregnede verdier som inng&aring;r i modellen er d&oslash;gnmiddel, daglig varmesum og akkumulert varmesum.<br /><br /><br /></p>\n<h3>Tolking av varsel</h3>\n<p>Merk at modellen er en ren temperaturstyrt modell som ikke tar hensyn til reelt angrep. Det er derfor viktig &aring; gj&oslash;re unders&oslash;kelser i egen &aring;ker i tillegg.</p>\n<p>Gr&oslash;nne bokser betyr at det ikke er fare for angrep. Gr&oslash;nne bokser presenteres i perioden f&oslash;r betingelsene for sverming er oppfylt (SUMDG &lt; 158).</p>\n<p>Gule bokser (f&oslash;r r&oslash;de bokser presenteres) varsler begynnende egglegging og rett tidspunkt for eggregistrering (<a href="http://www.vips-landbruk.no/media/attachments/information/Kaalfly_eggregistrering.pdf">http://www.vips-landbruk.no/media/attachments/information/Kaalfly_eggregistrering.pdf</a>) i egen &aring;ker. Gule bokser presenteres f&oslash;rste gang n&aring;r SUMDG = 158. Gule bokser presenteres ogs&aring; senere i sesongen, etter r&oslash;dt varsel, og angir da at det beste spr&oslash;ytetidspunktet (dvs n&aring;r larvene er sm&aring;) er passert. Larvene begynner &aring; bli s&aring; store at kjemisk bekjempelse er vanskelig (larvene har begynt &aring; bli lyssky og gnage seg inn i hodet p&aring; plantene).</p>\n<p>R&oslash;de bokser varsler rett tidspunkt for spr&oslash;yting (dersom det er p&aring;vist behov i egen &aring;ker ved eggregistrering). De fleste larvene er p&aring; dette tidspunktet sm&aring; og lever fritt eksponert p&aring; de ytre bladene.</p>\n<p>Gr&aring; bokser angir at varsel er avsluttet. Larvene er s&aring; store at kjemisk bekjempelse er sv&aelig;rt vanskelig eller ikke lenger aktuelt. Larvene er lyssky og har gnaget seg inn i hodene.</p>\n<h4>Forklaring til grafen</h4>\n<p>Den grafiske presentasjonen viser en samlet utvikling av akkumulerte d&oslash;gngrader, med de ulike basistemperaturene knyttet til det enkelte utviklingsstadium, relatert til terskelverdiene for hhv. start av sverming, begynnende egglegging, optimalt behandlingstidspunkt og sent behandlingstidspunkt (n&aring;r det fortsatt kan v&aelig;re noen sm&aring; larver, men de fleste begynner &aring; bli store).</p>\n<p>Grafen viser rette horisontale linjer for terskelverdiene for start av sverming, begynnende egglegging, optimalt behandlingstidspunkt og sent behandlingstidspunkt. Bakgrunnsfargen i grafen angir n&aring;r det er gr&oslash;nt, gult og r&oslash;dt varsel og n&aring;r varsel er avsluttet for sesongen (gr&aring; bakgrunnsfarge). N&aring;r linjen &laquo;Akkumulerte d&oslash;gngrader med varierende basistemperatur&raquo; krysser en av de horisontale terskellinjene, endrer varslet seg.</p>\n<p>Den loddrette, stiplete linjen angir dagens dato.<br /><br /><br /></p>\n<h3>Varslingssesong &ndash; oppstart og avslutning av varsel</h3>\n<h4>Starttidspunkt</h4>\n<p>Varslingsmodellen settes i gang 1. mai, med temperaturdata tilbake i tid.</p>\n<h4>Slutttidspunkt</h4>\n<p>Varslingsmodellen avsluttes (g&aring;r over til gr&aring;tt) n&aring;r sum d&oslash;gngrader = 557, da er det ikke lenger aktuelt med kjemisk bekjempelse pga at larvene er for store, er lyssky og har gnaget seg inn i hodene.</p>\n<h3>Utpr&oslash;ving og validering av modellen</h3>\n<h4>Nasjonalt</h4>\n<p>Modellen ble tidligere brukt i dav&aelig;rende Plantevernets telefoniske varslingstjeneste (NORPRE) i 1993-1999. Modellen ble tatt i bruk i VIPS da VIPS f&oslash;rste gang ble lansert i 2001.</p>\n<p>Modellen har v&aelig;rt fors&oslash;kt validert i Norge, men de gangene det er gjort en innsats p&aring; dette omr&aring;det har det ikke v&aelig;rt angrep av k&aring;lfly.</p>\n<h4>Internasjonalt</h4>\n<p>Forel&oslash;pig ingen informasjon.</p>\n<p><br /><br /></p>\n<h3>Referanser</h3>\n<h1>Referanser</h1>\n<p>Johansen, N. (1996). Prediction of field occurence of the cabbage moth, Mamestra brassicae (Lepidoptera: Noctuidae): Pheromon traps and day-degree. Norwegian Journal of Agricultural Sciences, 10: 541-554.</p>\n<p>Johansen, N. (1997). Influence of temperature on development, fecundity and survival of the cabbage moth Mamestra brassicae (L.) (Lep., Noctuidae) in relation to the improvement of forecasting and control methods. Journal of Applied Entomology, 121: 81-88. doi:10.1111/j.1439-0418.1997.tb01375.x</p>\n<p>Johansen, N.S. 1994. Varsling av k&aring;lfly (<em>Mamestra brassicae</em> L.). Gartneryrket 84, 20-21.</p>\n<p>Kontaktpersoner:&nbsp;<a href="http://www.nibio.no/ansatte/annette_folkedalschjll" target="_blank">Annette F. Schj&oslash;ll</a></p>\n<h3>Lenker til mer informasjon</h3>\n<p>Mer om k&aring;lfly (<em>Mamestra brassicae</em>) finner du i Plantevernleksikonet <br /><a href="http://leksikon.nibio.no/vieworganism.php?organismId=1_49">http://leksikon.nibio.no/vieworganism.php?organismId=1_49</a></p>\n<p>Informasjon om eggregistrering i egen &aring;ker<br /><a href="http://www.vips-landbruk.no/media/attachments/information/Kaalfly_eggregistrering.pdf">http://www.vips-landbruk.no/media/attachments/information/Kaalfly_eggregistrering.pdf</a></p>
statusInterpretation=<p>Merk at modellen er en ren temperaturstyrt modell som ikke tar hensyn til reelt angrep. Det er derfor viktig &aring; gj&oslash;re unders&oslash;kelser i egen &aring;ker i tillegg.</p>\n<p><strong>Forklaring til grafen</strong></p>\n<p>Den grafiske presentasjonen viser en samlet utvikling av akkumulerte d&oslash;gngrader, med de ulike basistemperaturene knyttet til det enkelte utviklingsstadium, relatert til terskelverdiene for hhv. start av sverming, begynnende egglegging, optimalt behandlingstidspunkt og sent behandlingstidspunkt (n&aring;r det fortsatt kan v&aelig;re noen sm&aring; larver, men de fleste begynner &aring; bli store).</p>\n<p>Grafen viser rette horisontale linjer for terskelverdiene for start av sverming, begynnende egglegging, optimalt behandlingstidspunkt og sent behandlingstidspunkt. Bakgrunnsfargen i grafen angir n&aring;r det er gr&oslash;nt, gult og r&oslash;dt varsel og n&aring;r varsel er avsluttet for sesongen (gr&aring; bakgrunnsfarge). N&aring;r linjen &laquo;Akkumulerte d&oslash;gngrader med varierende basistemperatur&raquo; krysser en av de horisontale terskellinjene, endrer varslet seg.</p>\n<p>Den loddrette, stiplete linjen angir dagens dato.</p>\n<p><strong>Forklaring til tabellen</strong></p>\n<p>N&aring;r varselstatus er gr&oslash;nn er det ikke fare for angrep</p>\n<p>N&aring;r varselstatus er gul (f&oslash;r r&oslash;de bokser presenteres) varsles det begynnende egglegging og rett tidspunkt for eggregistrering (<a href="http://www.vips-landbruk.no/media/attachments/information/Kaalfly_eggregistrering.pdf">http://www.vips-landbruk.no/media/attachments/information/Kaalfly_eggregistrering.pdf</a>) i egen &aring;ker. Gule bokser presenteres f&oslash;rste gang n&aring;r SUMDG = 158. Gul varselstatus presenteres ogs&aring; senere i sesongen, etter r&oslash;dt varsel, og angir da at det beste spr&oslash;ytetidspunktet (dvs n&aring;r larvene er sm&aring;) er passert. Larvene begynner &aring; bli s&aring; store at kjemisk bekjempelse er vanskelig (larvene har begynt &aring; bli lyssky og gnage seg inn i hodet p&aring; plantene).</p>\n<p>N&aring;r varselstatus er r&oslash;d varsles det rett tidspunkt for spr&oslash;yting (dersom det er p&aring;vist behov i egen &aring;ker ved eggregistrering). De fleste larvene er p&aring; dette tidspunktet sm&aring; og lever fritt eksponert p&aring; de ytre bladene.</p>\n<p>N&aring;r varselstatus er gr&aring; har larvene blitt s&aring; store at kjemisk bekjempelse er sv&aelig;rt vanskelig eller ikke lenger aktuelt.</p>\n<p>&nbsp;</p>
