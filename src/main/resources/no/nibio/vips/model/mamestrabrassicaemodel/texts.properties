name=Cabbage moth model
description={{filename="/images/ef-20051121-130756.jpg" description="Photo: E. Fl\u00f8istad"}}\n<h3>Description of model</h3>\n<p>The model for the warning system for cabbage moth was developed by Dr. Nina Svae Johansen. It is based on the minimum temperature threshold and the requirement for accumulated day-degrees for the different stages of the cabbage moth [CITATION Joh96 \\t \\l 1044 ]. The accumulated degree-day model calculates forecasts for development of the cabbage moth through the summer, generates warnings for the time when eggs and small larvae can be registered in the field and the best time for treatment [CITATION Joh97 \\t \\l 1044 ].</p>\n<p>Table 1: Developmental stages of the cabbage moth, base temperature requirement and day-degrees for development</p>\n<table>\n<tbody>\n<tr>\n<td>\n<p><strong>Developmental period</strong></p>\n</td>\n<td>\n<p><strong>Base temperature</strong></p>\n</td>\n<td>\n<p><strong>Day-degree requirement</strong></p>\n</td>\n<td>\n<p><strong>Accumulated day-degrees <br /> (with different base temperatures)</strong></p>\n</td>\n<td>\n<p><strong>Warning status </strong></p>\n</td>\n</tr>\n<tr>\n<td>\n<p>1. Development of overwintered pupae until adult flight period</p>\n</td>\n<td>\n<p>Pupae: 7,5 &deg;C (TMJ10)</p>\n</td>\n<td>\n<p>129</p>\n</td>\n<td>\n<p>129</p>\n</td>\n<td bgcolor="#70ad47">\n<p>SUMDG &lt; 158</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>2. Start of flight period until oviposition</p>\n</td>\n<td>\n<p>Oviposition: 5,0 &deg;C (TM)</p>\n</td>\n<td>\n<p>56</p>\n</td>\n<td>\n<p>129+56=158</p>\n</td>\n<td bgcolor="#ffc000">\n<p>SUMDG &ge;158&lt;326</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>3. Start of oviposition until the first larvae in stage L2</p>\n</td>\n<td>\n<p>Eggs: 8,6 &deg;C (TM)</p>\n<p>L1: 7,7 &deg;C (TM)</p>\n</td>\n<td>\n<p>Eggs: 75</p>\n<p>L1: 66</p>\n</td>\n<td>\n<p>129+56+75+66=326</p>\n</td>\n<td bgcolor="#ff0000">\n<p>SUMDG &ge;326&lt;428</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>4. From the first larvae in stage L2 until the first larvae in stage L4</p>\n</td>\n<td>\n<p>L2: 6,9 &deg;C (TM)</p>\n<p>L3: 6,3 &deg;C (TM)</p>\n</td>\n<td>\n<p>L2: 49</p>\n<p>L3: 53</p>\n</td>\n<td>\n<p>129+56+75+66+49+53=428</p>\n</td>\n<td bgcolor="#ffc000">\n<p>SUMDG &ge;428&lt;557</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>5. From the first larvae in stage L4 until the first larvae in stage L6</p>\n</td>\n<td>\n<p>L4: 4,3 &deg;C (TM)</p>\n<p>L5: 6,0 &deg;C (TM)</p>\n</td>\n<td>\n<p>L4: 67</p>\n<p>L5: 62</p>\n</td>\n<td>\n<p>129+56+75+66+49+53+67+62=557</p>\n</td>\n<td bgcolor="#d0cece">\n<p>SUMDG &ge;557</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>Historical weather data and weather forecasts are used in the model (2-day forecasts, i.e. forecasts for the same day and the next day).</p>\n<p>The input measurements for the model are hourly standard air temperature (TM) and soil temperature at a depth of 10 cm (TMJ 10). The calculated values that are input in the model are daily mean, daily accumulated temperature and total accumulated temperature.</p>\n<h3>Interpretation of the warning</h3>\n<p>Note that the model is based on temperature, it is not related to the presence or absence of cabbage moth in the field. Thus, it is important to evaluate the situation in the field.</p>\n<p>Green rectangles indicate that there is no danger of attack. Green rectangles are shown prior to the start of oviposition (SUMDG &lt; 158).</p>\n<p>Yellow rectangles (prior to red rectangles) indicate that oviposition has begun and that the farmer should make observations in the field. Yellow rectangles are first shown when the soil temperature has reached 158 day-degrees (SUMDG=158). Yellow rectangles are also shown later in the season, after a red warning, to indicate that it is beyond the optimal time for treatment (the small larval instars). The larvae are too big for effective chemical control (they seek shelter from the sun inside the heads).</p>\n<p>Red rectangles indicate the optimal time for treatment (when when registration in the field indicates attack). At this time most of the larvae are small and easily targeted on the outer leaves.</p>\n<p>Grey rectangles indicate that the warning has ended. The larvae are so big that chemical control is very difficult or no longer possible.</p>\n<p><strong>Explanation of the graph</strong></p>\n<p>The graphic presentation shows the combined development of the accumulated day-degrees, with the different base temperatures related to the separate developmental stages, related to the threshold values for: start of flight period, start of oviposition, optimal time of treatment and late time of treatment (when there may still be some small larvae, but most are too big).</p>\n<p>The graph shows straight horizontal lines for the threshold values for the start of the flight period, optimal time of treatment and late time of treatment. The background color on the graph indicates when the warning is green, yellow and red and when the warning has ended for the season (grey background color). When the line &laquo;Cumulative day-degrees with varying base temperatures&raquo; crosses one of the horisontal threshold lines, the warning changes.</p>\n<p>The vertical dotted line indicates today&rsquo;s date.</p>\n<h4>Warning season &ndash; start and end of the warning</h4>\n<h4>Starting time</h4>\n<p>The warning model is started May 1st using previously recorded temperatures.</p>\n<h4>Ending time</h4>\n<p>The warning model is finished (changes to grey) when the accumulated day-degrees = 557. At this point chemical control is no longer possible as the larvae are too big, they seek shelter from light and have chewed into the heads.</p>\n<h3>Testing and validation of the model</h3>\n<h4>Nationally</h4>\n<p>The model was previously used by &rdquo;Planteforsk Plantevernets&rdquo; telephone warning service (NORPRE) from 1993-1999. The model has been used in VIPS since VIPS began in 2001.</p>\n<p>There have been attempts to validate the model in Norway, but when this was attempted there was no cabbage moth attack.</p>\n<h4>Internationally</h4>\n<p>There is no information at present.</p>\n<p>&nbsp;</p>\n<h3>References</h3>\n<p>Johansen, N. (1996). Prediction of field occurence of the cabbage moth, <em>Mamestra brassicae</em> (Lepidoptera: Noctuidae): Pheromon traps and day-degree. Norwegian Journal of Agricultural Sciences, 10: 541-554.</p>\n<p>Johansen, N. (1997). Influence of temperature on development, fecundity and survival of the cabbage moth <em>Mamestra brassicae</em> (L.) (Lep., Noctuidae) in relation to the improvement of forecasting and control methods. Journal of Applied Entomology, 121: 81-88. doi:10.1111/j.1439-0418.1997.tb01375.x</p>\n<p>Johansen, N.S. 1994. Varsling av k&aring;lfly (<em>Mamestra brassicae</em> L.). Gartneryrket 84, 20-21.</p>\n<h3>Contacts</h3>\n<p>Annette F. Schj&oslash;ll (<a href="mailto:annette.folkedal.schjoll@nibio">annette.folkedal.schjoll@nibio</a>)</p>\n<h3>Links for more information</h3>\n<p>More information on cabbage moth (<em>Mamestra brassicae</em>) is available in the Plantevernleksikonet (Norwegian only):&nbsp;<a href="https://www.plantevernleksikonet.no/l/oppslag/49/" target="_blank">https://www.plantevernleksikonet.no/l/oppslag/49/</a></p>
statusInterpretation=<p>Note that the model is based on temperature, it is not related to the presence or absence of cabbage moth in the field. Thus, it is important to evaluate the situation in the field.</p>\n<p><strong>Explanation of the graph</strong></p>\n<p>The graphic presentation shows the development of the accumulated day-degrees, with the different base temperatures related to each developmental stage, which in turn are related to the start of the flight period, start of oviposition, optimal time of treatment and late time of treatment (when there may still be some small larvae, but most are too big).</p>\n<p>The graph shows straight horizontal lines for threshold values for the start of the flight period, start of oviposition, optimal time of treatment and late time of treatment. The background color in the graph indicates when there is a green, yellow or red warning, or that the warnings are over for the season (grey background). When the line &laquo;Accumulated day-degrees at different base temperatures&raquo; crosses one of the horizontal threshold lines, the warning changes.</p>\n<p>The vertical dotted line shows the current date.</p>\n<p><strong>Explanation of the table</strong></p>\n<p>When the warning status is green there is no danger of attack.</p>\n<p>Yellow warning status (prior to red rectangles) indicates that oviposition has begun and that the farmer should make observations in the field. Yellow rectangles are first shown when the soil temperature has reached 158 day-degrees (SUMDG=158). Yellow warning status also appears later in the season, after a red warning, to indicate that it is beyond the optimal time for treatment (the small larval instars). The larvae are too big for effective chemical control (they seek shelter from the sun inside the heads).</p>\n<p>Red rectangles indicate the optimal time for treatment (when when registration in the field indicates attack). At this time most of the larvae are small and easily targeted on the outer leaves.</p>\n<p>Grey rectangles indicate that the warning has ended. The larvae are so big that chemical control is very difficult or no longer possible.</p>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* TM - Mean temperature in deg Celcius\n* TJM10 - Mean soil temperature at 10 cm depth in deg Celcius (used for dd accumulation until PUPAE threshold is reached)\n\nThe model starts aggregating the day degrees from the earliest weather data provided in the input data\n\nThese should all be complete timeseries of daily data from the same time period. The model accepts hourly data as well, and aggregates these into daily values.
